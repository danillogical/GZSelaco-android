// Match the Ayn Thor's Selaco settings on a desktop build.
//
// Windows cannot show the Steam Deck presets: the menu gates them behind
// ifOption(Unix) (MENUDEF.zsc:337), a build-platform check in the menu parser that
// no cvar can override. TestForSteamDeck() is also unreachable on Windows - it
// early-returns on !TestForLinux() before it ever checks resolution, so 1280x800
// (and certainly 1280x720) does nothing there. Setting the cvars directly is the
// only way.
//
// An autoexec is required rather than merely convenient: most of these are declared
// `nosave` in Selaco's CVARINFO, so they reset to their defaults on every launch and
// the menu cannot make them stick either.
//
// Where to put this: check the [Selaco.AutoExec] section of your selaco-ea.ini for
// the path it expects, and save this file there.

// ---- GFXPresetDeckLow ("Steam Deck Optimized for Performance") --------------
r_shadowQuality 1
gl_texture_filter 6
gl_light_shadowmap 1
r_rainquality 1
gl_shadowmap_quality 512
gl_shadowmap_filter 0
gl_fxaa 0
r_waterquality 1
gl_ssao 2
r_reflections 0
cl_maxdecals 500
r_thingLOD 700
smokeeffects 0
r_smokequality 2
r_particleIntensity 2
r_particleLifespan 1
r_BloodQuality 1
lightingquality 2
r_fogeffects 1
gl_bloom 1
r_filmgrain 0
r_filmgrain_intensity 0.025
gl_lens 0
g_gamedetail 3
r_drawplayersprites 1
r_mirror_recursions 2
g_permanentDestruction 0
g_permanentGore 0
r_muzzleflashShadows 0
r_flashlightshadows 0
gl_link_playerlights 0

// ---- VisibilityPresetSpectacleDeck ("Favour Spectacle, Steam Deck Optimized")
// Both values are already set by DeckLow above, so this is a no-op in practice -
// listed for completeness. Note r_particleLifespan 1 means a lifespan of ONE TIC
// (lifespanSettings[] = {1, 60, 160, 900, 3500}, PARTICLES.zsc:10), which is why
// explosion smoke does not linger. Use 2 for ~1.7 s of residue.
r_smokedensity 1
r_particleLifespan 1

// ---- SetSteamdeckPresets() UI profile (helper.zs:616) -----------------------
// Only applied automatically on first run, and only when the Deck is detected -
// so on a desktop it has to be set here. Sized for a 7-inch handheld; drop these
// if you are on a large monitor and only want the graphics to match.
ui_scaling 1.2
hud_scaling 1.2
snd_subtitlesize 4
g_hudopacity 0
hud_meter_scaling 1.0

// ---- Display, to match the Thor --------------------------------------------
// The Thor renders at native 1920x1080 with vsync on and a 30 fps cap.
vid_vsync 1

// CAUTION: stock Selaco clamps this UP to the tic rate (35) - `if (self <
// GameTicRate) self = GameTicRate`. A true 30 cap needs an engine change (this
// repo relaxes the floor; the retail Windows build does not), so on Windows you
// will get 35, which judders on a 60 Hz panel because 35 is not an even divisor.
// Cap at 30 in the GPU driver or RTSS instead if you want to match exactly.
vid_maxfps 30

// Optional: unlocks the Deck-tuned menu items such as the lower minimum FOV.
// It cannot bring back the Deck preset list - that is the ifOption(Unix) gate.
// Declared `nosave noarchive`, so it must be re-set every launch from here.
g_steamdeck 1
