// Selaco - Ayn Thor, full game, Mesa/Turnip driver + frame-time logging
//
// Identical to thor.cfg except i_benchmark is on. Kept separate so the shipped
// default stays quiet - i_benchmark is CVAR_ARCHIVE, so once it is on it stays on
// in the ini until something sets it back, which has already caused one run to be
// measured under settings nobody intended.
//
// Deliberately almost empty. The full game owns its own graphics settings through
// its in-menu presets (GFXPreset* and the Visibility axis), it persists them to
// selaco-ea.ini, and its first-run dialog works fine with a gamepad on this device
// - g_tos reaches 2 on its own, so there is nothing to bypass.
//
// Do NOT add graphics cvars here. An earlier version of this config carried a full
// demo-derived graphics block, which (a) silently overrode whatever preset you
// picked in the menu on the next launch, and (b) set cvars the full game no longer
// has: r_effectLOD is gone, reflections became r_reflections, r_gamedetail became
// g_gamedetail, r_permanentblood split into g_permanentGore/g_permanentDestruction.
// Pick presets in-game instead. See configs/README.md.
//
// Only settings that Selaco's own menus cannot express belong here.

// g_steamdeck is now defaulted ON by the engine for Android (d_main.cpp, right
// after ParseCVarInfo), so it does NOT need to be set here. Selaco's own detection
// can never fire on this device - it requires a 1280x800 screen (helper.zs:675) -
// and the cvar is `nosave noarchive` (CVARINFO:6) so it cannot persist in the ini
// either, which is why the engine sets it every launch instead.
//
// Uncomment to opt out and be treated as a desktop; the engine sets its default
// before autoexec runs, so this still wins.
//g_steamdeck 0

// Engine default is false (v_video.cpp:182). On a handheld we want it on: it caps
// the GPU at the panel's 60 Hz instead of burning power and thermal headroom
// rendering frames nobody sees.
vid_vsync 1

// 30 fps lock. Needs the relaxed vid_maxfps floor added in this tree - stock GZDoom
// clamps the cvar up to GameTicRate (35), and 35 is worse than 30 on a 60 Hz panel
// because 30 divides it exactly (two vblanks every frame) while 35 alternates one
// and two, which reads as judder. Set 0 to unlock.
//
// This is for consistency and thermals, not throughput: it does not make a heavy
// frame cheaper, it stops light frames oscillating between 60 and 30.
vid_maxfps 30

// Explicitly off, not merely unset. i_benchmark is CVAR_ARCHIVE, so once it has
// been switched on it stays on in the ini forever and keeps writing to logcat -
// which is how a supposedly unlocked measurement run turned out to still be locked
// at 30 fps from a previous config. State it every time.
//
//   adb logcat -s selaco-ea:V | grep BENCH
// 2 = also log individual frames over i_benchmark_spike ms.
i_benchmark 2
i_benchmark_interval 5
i_benchmark_spike 33.4
// Frames above this are treated as level loads and excluded from the percentiles,
// reported on their own line instead. A map load is a single ~1300 ms frame and
// leaving it in dragged a window mean from 33.3 to 42.7 ms.
i_benchmark_ignore 500

// --- Audio ------------------------------------------------------------------
// Nothing set here on purpose. The mixer crash that made this section necessary
// (SIGSEGV/SEGV_ACCERR on the audio thread, every frame inside libopenal.so) was a
// size_t underflow in openal-soft's LoadBufferStatic loop branch, now fixed at the
// source - see patch_openal_loop_overrun in android/deps/build-deps.sh.
//
// Two mitigations were tried first and BOTH failed, so do not reach for them again:
//   snd_channels 32       - engine clamps to a floor of 64 (oalsound.cpp:58), so the
//                           real test was 128->64 voices. Crashed identically.
//   snd_alresampler Linear- inconclusive; oalsound.cpp only logs on failure, so a
//                           silent log cannot distinguish "applied" from "extension
//                           absent". Crashed either way.
// Swapping the OpenAL backend (OpenSL -> SDL2) also only delayed it.

// --- Replacement Vulkan driver: Mesa/Turnip -----------------------------------
// Loads Mesa/Turnip in place of Qualcomm's Adreno driver, via libadrenotools.
// Verified working on an Ayn Thor: reports "PurpleVK-public Adreno (TM) 740",
// Vulkan 1.4.359, Mesa driver 26.2.99, against the stock 1.3.128 / 512.676.53.
//
// Put the driver anywhere readable and point this at it; the engine copies it into
// internal storage itself, because dlopen refuses a world-writable path and /sdcard
// is noexec besides.
//
// Three non-obvious requirements, all handled in code but worth knowing:
//   - the staged copy keeps the source basename, since Android keys libraries by
//     DT_SONAME and a Turnip build's soname is its filename
//   - adrenotools concatenates its dir and name arguments with no separator, so the
//     directory it is given must end in a slash
//   - the hook libraries must sit in nativeLibraryDir, which needs
//     useLegacyPackaging = true in app/build.gradle
//
// If anything fails the engine falls back to the system driver and says why, so this
// is safe to leave set.
vk_driver "/sdcard/Selaco/vulkan.purple.so"
