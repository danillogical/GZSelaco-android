// Selaco - deck-high at 0.75 resolution scale (1440x810)
//
// Identical to deck-high in every graphics setting; the ONLY difference is
// vid_scalefactor. See android/configs/README.md.

// ---------------------------------------------------------------- first run ---
// Android only. Selaco's first-run flow (TOS + quality picker) is a custom
// mouse-driven ZScript UI that a gamepad cannot fully navigate, and there is no
// touch input yet, so it is skipped here and the settings set explicitly below.
// firstRun is `g_tos == 0` (zscripts/UI/intro_handler.zs:69); completing the
// dialog sets it true (quality_menu.zs:230).
// The macOS build deliberately does NOT do this - the dialog works fine there.
g_tos 1
g_promptridiculous 0

// Suppresses "Your configuration file is out of date or does not exist."
// (OnlyIfNot g_iniexists, MENUDEF.COCK:54). This engine build does not apply the
// value the shipped ini sets - reproduced on macOS too, so it is a demo/engine
// version mismatch, not an Android fault.
g_iniexists true

// ------------------------------------------------------------------ display ---
vid_preferbackend 1        // Vulkan. Adreno 740 reports Vulkan 1.3.128.
vid_vsync 1                // 60 fps ceiling. Also stops the GPU burning power
                           // and thermal headroom rendering frames past the
                           // panel refresh, which matters on a handheld.
// 30 fps lock. Chosen over 35 (the old vid_maxfps floor) because 30 divides the
// panel's 60 Hz exactly - two vblanks per frame, every frame - while 35 does not,
// so 35 would alternate one and two vblanks and read as judder.
//
// This is for consistency and thermals, not throughput: it does not make a heavy
// frame cheaper, it stops the light ones oscillating between 60 and 30, which is
// the most visible artefact. Set 0 to unlock.
vid_maxfps 30
vid_scalemode 0            // 0 = Native. NOT the custom-resolution mode - that is
                           // mode 5. vid_scale_customwidth/height are ignored here,
                           // so do not use them to change resolution; a config that
                           // set them at mode 0 rendered at full 1080p while looking
                           // like it was testing 720p.
// 1440x810 - 56% of 1080p's pixels. This is the A/B against deck-high at 1.0.
// Explosion frames are dominated by translucent overdraw in the main scene pass
// (~37 ms of a 47 ms frame, with VM at 2.5 ms and the whole postprocess chain at
// 3.9 ms), and overdraw scales with pixel count - so this is the only lever left
// with real leverage. A previous "720p" test used vid_scale_customwidth/height at
// vid_scalemode 0, where they are ignored, so it silently ran at 1080p and made
// resolution look useless. It is not.
vid_scalefactor 0.75
vid_fps 1                  // Frame counter, so tuning is measured not guessed.

// ---------------------------------------------------------------- textures ---
gl_texture_filter 6   // Trilinear + anisotropic (top of Selaco's menu)
gl_texture_filter_anisotropic 16 // Adreno handles aniso cheaply
gl_texture_hqresizemult 1   // 1 = OFF. Leave it off: hqresize upscales on the
                                 // CPU and multiplies texture memory, which is the
                                 // wrong trade on a handheld.

// ------------------------------------------------------------------ shadows ---
gl_light_shadowmap 1
gl_shadowmap_quality 512
gl_shadowmap_filter 3
r_shadowQuality 1
g_spriteshadows 1
r_FlashlightShadows 0   // not in the preset; off by default in Selaco, and it
                        // adds a shadow pass whenever the flashlight is out

// -------------------------------------------------------------- postprocess ---
// Each of these is a full-screen pass, and on a tile-based GPU every pass forces
// a tile-memory resolve and reload. This chain is the main mobile cost centre.
gl_ssao 2
gl_bloom 1
gl_lens 0
r_filmgrain 0
gl_fxaa 0
gl_multisample 0        // not in the preset; Selaco default

// ------------------------------------------------------- world and effects ---
r_gamedetail 3
lightingquality 2
r_waterquality 1
r_enableFog 1
r_fogeffects 1
r_lightshafts 1
r_fireeffects 1
r_snoweffects 1
smokeeffects 1
// 3 is not just "more smoke" - it is a threshold. PipeBurster, the steam-jet
// actor behind the volumetric steam sections, kills itself on spawn when this is
// below 3 (TEXTUREMATERIALS.zsc:231), so at 2 those set pieces do not exist at
// all. Explosion smoke and particle counts also scale linearly off both cvars as
// 0.2 * value (EXPLOSIONS.zsc:61,70), making 3 = 0.6x and 2 = 0.4x of authored.
r_smokequality 3
// Deviates from GFXPresetDeckHigh, which uses 3. This is the one lever that
// measurably moves the explosion dip: it drives both the global particle spawn
// chance (45% -> 30%, PARTICLES.zsc:3) and the debris/spark/ember density
// (0.6x -> 0.4x, EXPLOSIONS.zsc:61).
//
// Lowered on its own rather than as part of the preset because r_smokequality
// stays at 3 above, so the steam-vent set pieces survive (they need >= 3,
// TEXTUREMATERIALS.zsc:231) and smoke trails stay at 0.6x. Dropping the whole
// preset to deck-low would take the vents out with it.
r_particleIntensity 2
r_particleLifespan 1
r_persistantParticles 0
particlePhysics 1
r_BloodQuality 2
PhysicsLimit 1500
r_drawplayersprites 1

// ----------------------------------------------------- mirrors and decals ---
mirrorsurfaces 0           // each recursion level is a full extra scene render
r_mirror_recursions 2   // Deliberately not 4. Each level is a full additional

reflections 0   // Off even in Selaco's Ridiculous preset.

cl_maxdecals 1000   // Ridiculous uses 15000. That is draw calls and memory

r_permanentblood 0
r_ThingLOD 1800
// Draw distance for effect actors that opt into GZDoom's
// DistanceCheck "r_effectLOD" (SMOKE.zsc:222,293) - it culls smoke that has
// already spawned, so it cannot bring back effects that were never created.
// r_smokequality above is what gates the steam sections existing at all.
r_effectLOD 1800

// ------------------------------------------------------- If it misses target ---
// Ordered by MEASURED effect on an Ayn Thor, not by guesswork. An earlier version
// of this list had it backwards - postprocess first, resolution last - which was
// wrong by more than an order of magnitude.
//
//   1. vid_scalefactor           BY FAR the biggest lever. Explosion cost is
//                                translucent overdraw in the main scene pass, which
//                                scales with pixel count. 1080p -> 960x540 measured
//                                43 -> 21 ms. 0.75 (1440x810) is 56% of the pixels
//                                and hard to see on a 7-inch panel.
//                                NB: use this, not vid_scale_customwidth/height -
//                                those do nothing unless vid_scalemode is 5.
//   2. r_smokequality            0.2x density per step (EXPLOSIONS.zsc:70). Below 3
//                                also deletes the steam-vent set pieces entirely
//                                (TEXTUREMATERIALS.zsc:231), so this is the one that
//                                costs you content, not just fidelity.
//   3. r_particleIntensity       measured ~3 ms going 3 -> 2.
//   4. gl_ssao / gl_bloom        ~1.2 ms TOTAL, measured. Nearly pointless: the whole
//                                instrumented postprocess chain is 1.5-4.5 ms of a
//                                33 ms frame.
//
// Measured to be NOT worth changing:
//   r_ThingLOD / r_effectLOD / cl_maxdecals   no measurable gain at deck-low's values
//   an arm64 ZScript JIT                      the VM is ~1 ms/frame; think is 0.8 ms
//
// And one thing no setting can fix: a ~1.3 s hitch on section load, which is ~2997
// thinkers costing ~500 ms of Think in a single tic while the GPU sits idle.

// Integer UI multiplier. 0=auto (=2 at 1080p), useful range 3-5, ceiling 5.
uiscale 3

// Notify/console messages scale independently of uiscale (c_notifybuffer.cpp:62);
// 0 means "follow uiscale". At uiscale 3 they get large enough to overlap the
// title text, so pin them to 2 and let menus stay big.
con_scaletext 2

// --- Selaco's own UI scaling (this is the one that actually matters) ---------
// Selaco ignores GZDoom's uiscale/hud_scalefactor for its custom ZScript UI and
// uses these instead. From CVARINFO:137,165 - the author's own comment there is
// "hud_scalefactor and hud_scale already exist!?".
//
// Both are plain floats with NO upper clamp; the menu only offers 0.9/0.8/0.7
// because desktop users only ever want it smaller. On a 7-inch handheld we want
// the opposite.
//
//   ui_scaling  <= 0 means auto: clamp(min(w/1920, h/1080), 0.5, 2.0)
//                    which is exactly 1.0 at 1080p (intro_handler.zs:173)
//   hud_scaling      multiplies that: 0.89 default -> 0.89 at 1080p (drawers.zs:7)
//
// Careful: both snap to exactly 1.0 if within 0.08 of it, so values between 0.92
// and 1.08 all collapse to 1.0. Step outside that band to see any change.
ui_scaling 1.1
hud_scaling 1.0

// In-game HUD scale, separate from uiscale. The engine hard-clamps this to
// 0.36-1.0 (base_sbar.cpp:69) and larger = bigger HUD, because the maths is
// hudwidth = 640 / hud_scalefactor. 1.0 is the maximum. Set here so it applies at
// launch - the value defaults to 1 but only takes effect once something fires
// HudScaleChanged, which is why nudging the slider appeared to change things.
hud_scalefactor 1.0

// --- Performance benchmarking -----------------------------------------------
// Logs frame-time percentiles to logcat every i_benchmark_interval seconds, plus
// the engine's own VM / think / gpu / rendertimes stats so a spike can be
// attributed rather than guessed at. 2 = also log every frame over the spike
// threshold, which is what catches explosions.
//   adb logcat -s selaco-ea:V | grep BENCH
i_benchmark 2
i_benchmark_interval 5
i_benchmark_spike 33.4
