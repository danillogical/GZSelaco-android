// Selaco - Ayn Thor, full game
//
// Deliberately almost empty. The full game owns its own graphics settings through
// its in-menu presets (GFXPreset* and the Visibility axis), it persists them to
// selaco-ea.ini, and its first-run dialog works fine with a gamepad on this device
// - g_tos reaches 2 on its own, so there is nothing to bypass.
//
// Do NOT add graphics cvars here. An earlier version of this config carried a full
// demo-derived graphics block, which (a) silently overrode whatever preset you
// picked in the menu on the next launch, and (b) set cvars the full game no longer
// has: r_effectLOD is gone, reflections became r_reflections, r_gamedetail became
// g_gamedetail, r_permanentblood split into g_permanentGore/g_permanentDestruction.
// Pick presets in-game instead. See configs/README.md.
//
// Only settings that Selaco's own menus cannot express belong here.

// g_steamdeck is now defaulted ON by the engine for Android (d_main.cpp, right
// after ParseCVarInfo), so it does NOT need to be set here. Selaco's own detection
// can never fire on this device - it requires a 1280x800 screen (helper.zs:675) -
// and the cvar is `nosave noarchive` (CVARINFO:6) so it cannot persist in the ini
// either, which is why the engine sets it every launch instead.
//
// Uncomment to opt out and be treated as a desktop; the engine sets its default
// before autoexec runs, so this still wins.
//g_steamdeck 0

// Engine default is false (v_video.cpp:182). On a handheld we want it on: it caps
// the GPU at the panel's 60 Hz instead of burning power and thermal headroom
// rendering frames nobody sees.
vid_vsync 1

// 30 fps lock. Needs the relaxed vid_maxfps floor added in this tree - stock GZDoom
// clamps the cvar up to GameTicRate (35), and 35 is worse than 30 on a 60 Hz panel
// because 30 divides it exactly (two vblanks every frame) while 35 alternates one
// and two, which reads as judder. Set 0 to unlock.
//
// This is for consistency and thermals, not throughput: it does not make a heavy
// frame cheaper, it stops light frames oscillating between 60 and 30.
vid_maxfps 30

// Native render resolution. Stated, not omitted: vid_scalefactor is CVAR_ARCHIVE, so a
// any profile that once set a reduced scale leaves it in selaco-ea.ini and every later profile
// silently renders at 960x540. That already invalidated one run whose whole purpose was to
// be the full-res baseline - the giveaway was ssao reading 0.40 ms instead of ~2.0.
vid_scalefactor 1.0

// --- Audio ------------------------------------------------------------------
// Nothing set here on purpose. The mixer crash that made this section necessary
// (SIGSEGV/SEGV_ACCERR on the audio thread, every frame inside libopenal.so) was a
// size_t underflow in openal-soft's LoadBufferStatic loop branch, now fixed at the
// source - see patch_openal_loop_overrun in android/deps/build-deps.sh.
//
// Two mitigations were tried first and BOTH failed, so do not reach for them again:
//   snd_channels 32       - engine clamps to a floor of 64 (oalsound.cpp:58), so the
//                           real test was 128->64 voices. Crashed identically.
//   snd_alresampler Linear- inconclusive; oalsound.cpp only logs on failure, so a
//                           silent log cannot distinguish "applied" from "extension
//                           absent". Crashed either way.
// Swapping the OpenAL backend (OpenSL -> SDL2) also only delayed it.

// --- Movement: nothing needed --------------------------------------------------
// cl_run and movebob were briefly set here after the Thor was found walking
// everywhere and bobbing violently. Both were REDUNDANT and have been removed:
// Selaco ships a CVARINFO.defaults lump that changes the defaults of stock GZDoom
// cvars, and our engine does implement `setdefault` (d_main.cpp:1738):
//
//   setdefault cL_run  = true;
//   setdefault movebob = 0.0126;    // the stock default of 0.25 is ~20x Selaco's max
//
// The device only had the wrong values because its ini was created back when the
// DEMO was installed, whose CVARINFO carried no defaults lump - and both cvars are
// CVAR_ARCHIVE, so a stale saved value beats a newly declared default. A clean first
// install picks them up correctly with no help from us.
//
// Setting them here was also actively harmful: it stopped the in-game "Weapon
// Bobbing" option (MENUDEF.zsc:108) from ever sticking.

// --- No on-screen debug text -------------------------------------------------
// Both are CVAR_ARCHIVE and both were left switched on by earlier debugging, so
// they have to be stated here to turn them back off.
//
// The frame-time/fps readout in the top right. Default is false
// (i_interface.cpp:35), so it must be stated to turn it ON.
//
// ON for the beta deliberately: a tester who can see the number reports "it dropped to
// 20 in that room" instead of "it felt choppy", which is the difference between a usable
// report and a guess. It also pairs with the fpsdips console command, which counts frames
// below i_dipfps over a whole session.
//
// Revisit for a non-beta release - most players do not want a permanent overlay.
vid_fps 1

// Lines of console text drawn over the top-left of the screen - script warnings,
// "Game saved.", and anything else Printf'd without PRINT_NONOTIFY. 0 draws none.
// Default is 4 (c_notifybuffer.cpp:69); there is no lower clamp, so 0 is valid.
//
// Delete these two lines to get the overlay back for debugging. Note con_scaletext
// only sizes this text, so it is irrelevant while notifylines is 0.
con_notifylines 0

// Back to auto sizing. Benchmark profiles set this to 4 to make the fps readout legible
// on a 7-inch panel, and it is CVAR_ARCHIVE, so without this line a run that had the
// overlay up leaves the console drawn at 4x forever. 0 means auto (2 at 1080p).
con_scale 0

// --- Stock Qualcomm driver ---------------------------------------------------
// Stated, not omitted. Both are CVAR_ARCHIVE, so a previous thor-turnip run leaves the
// replacement driver recorded in selaco-ea.ini and the SHIPPED profile would go on
// loading an experimental Mesa/Turnip build - one that needs a source patch to survive a
// level load, and that cannot be recovered from if it fails mid-frame.
//
// This is the same trap as i_benchmark above: an archived cvar that has to be turned back
// off explicitly rather than left unset.
vk_driver ""
vk_driver_env ""
