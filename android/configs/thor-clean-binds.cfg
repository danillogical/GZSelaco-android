// Selaco - Ayn Thor: ONE-TIME debug bind scrub. Dev use only, not shipped.
//
// Why this file exists. GZDoom SERIALISES key bindings into the ini, so every bind set by a dev
// config survives switching to another config, uninstalling that config, or shipping a build. A
// beta tester on a fresh install is unaffected - thor.cfg binds nothing - but a DEV device keeps
// the debug keys forever until they are explicitly removed. Hence this.
//
// Restores rather than blindly unbinds. Checked against the actual defaults:
//   - engine/defbinds.txt in gzdoom.pk3 is WASD only and binds no F-keys.
//   - Selaco's KEYCONF defaults exactly one of them: F6 -> quicksaveselaco.
// So unbind is correct for the rest, and F6 must be put back or quicksave is lost.
//
// Usage: ./android/set-config.sh thor-clean-binds     (then switch to thor)

unbind F1
unbind F2
unbind F3
unbind F4
unbind F5
bind F6 quicksaveselaco
unbind F7
unbind F8
unbind F9
unbind F10
unbind F11
unbind F12
unbind Home
unbind End
unbind Ins
unbind PgUp
unbind PgDn
unbind Del
unbind KP0
unbind KP1
unbind KP2
unbind KP3
unbind KP4
unbind KP5
unbind KP6
unbind KP7
unbind KP8
unbind KP9
unbind KP.
unbind KP+
unbind KP-
unbind KP*
unbind KP/
unbind KP=
unbind KP-Enter

// The SSAO A/B toggle borrowed this; printObjectives is its Selaco default.
bind DPadLeft printObjectives

// Pad_Back was temporarily the "restore objectives" key; codex is its Selaco default.
bind Pad_Back codex

// Debug-only cvars, back to shipping values in case any got left on.
i_benchmark 0
vid_fps 0
con_scale 0
vk_check_offsets 0

echo DEBUG_BINDS_CLEARED
