// Selaco - Ayn Thor: FIXED-VIEWPOINT A/B harness
//
// Load a savegame, stand still, and change one setting at a time WITHOUT restarting the
// app or reloading, by triggering bound function keys over adb:
//
//     adb shell input keyevent 131      # F1, and so on
//
// Why this exists. Every earlier comparison in this project was taken from a hand-played
// route, and that quietly invalidated three separate conclusions, because per-draw-list
// cost depends enormously on where the camera points: plainwalls measured 0.12 ms in one
// frame and 12.64 ms in another, purely from looking down a corridor versus at a floor.
// Comparing those across runs is meaningless. A fixed viewpoint makes plainwalls,
// plainflats and translucent directly comparable, which is the whole point.
//
// Protocol per test - STRICTLY ONE VARIABLE:
//   1. adb shell input keyevent 131        (F1: restore the FULL DeckLow baseline)
//   2. adb shell input keyevent <key>      (lower exactly one setting, echoes a marker)
//   3. wait ~14 s                          (i_benchmark_interval is 5 s, so 2 clean windows)
//   4. adb logcat -d -s selaco-ea:V | grep -E "BENCHMARK_SET|BENCH "
//
// ALWAYS re-press F1 first. The test aliases below each set a single cvar and do NOT undo
// the previous test, so without the restore the settings accumulate and every reading after
// the first is a multi-variable change wearing a single-variable label.
//
// ALWAYS confirm the echoed BENCHMARK_SET marker names the test you meant. adb keyevents fail
// SILENTLY - a wrong or missing marker has invalidated two full sweeps in this project, once
// because a key was bound twice in this very file and the later binding won.
//
// Keep vsync off and the frame rate unlocked or the cap hides everything being measured.

vid_vsync 0
vid_maxfps 0
vid_scalefactor 1.0

i_benchmark 2
i_benchmark_interval 5
i_benchmark_spike 33.4
i_benchmark_ignore 500

vid_fps 1
con_scale 4
con_notifylines 0

// Stock Qualcomm driver unless a vulkan.so is present next to the game data, which is now
// auto-detected. Both cvars are CVAR_ARCHIVE, so state them rather than inherit them.
vk_driver ""
vk_driver_env ""

// --- Baseline: GFXPresetDeckLow -----------------------------------------------
//
// Transcribed from the SHIPPED PRESET DEFINITION - MENUDEF.zsc's
// `OptionValue "GFXPresetDeckLow"` block inside Selaco.ipk3 - not from a stored ini.
//
// That distinction matters and cost a measurement. The first version of this came from
// android/configs/reference/README.md, which snapshotted a real session's ini, and an ini
// OMITS every cvar sitting at its engine default. Seven were therefore missing
// (r_filmgrain_intensity, r_drawplayersprites, g_permanentDestruction, g_permanentGore,
// r_muzzleflashShadows, r_flashlightshadows, gl_link_playerlights) and the result was
// visibly not DeckLow. Reconstruct a preset from MENUDEF, never from an ini.
//
// Deliberately NOT in thor.cfg: a graphics block in the shipped autoexec has silently
// overridden the player's menu choices three separate times in this repo's history. These
// are CVAR_ARCHIVE, so setting them once here persists them anyway.

alias bench_decklow "echo BENCHMARK_SET=decklow_baseline; r_shadowQuality 1; gl_texture_filter 6; gl_light_shadowmap 1; r_rainquality 1; gl_shadowmap_quality 512; gl_shadowmap_filter 0; gl_fxaa 0; r_waterquality 1; gl_ssao 2; r_reflections 0; cl_maxdecals 500; r_thingLOD 700; smokeeffects 0; r_smokequality 2; r_particleIntensity 2; r_particleLifespan 1; r_BloodQuality 1; lightingquality 2; r_fogeffects 1; gl_bloom 1; r_filmgrain 0; r_filmgrain_intensity 0.025; gl_lens 0; g_gamedetail 3; r_drawplayersprites 1; r_mirror_recursions 2; g_permanentDestruction 0; g_permanentGore 0; r_muzzleflashShadows 0; r_flashlightshadows 0; r_smokedensity 1; gl_link_playerlights 0"

bind F1 bench_decklow

// --- The sweep: each of the 13 cvars where DeckLow exceeds GFXPresetLow, one step down ----
//
// DeckLow is HEAVIER than GFXPresetLow, not lighter - of the 13 cvars that differ between the
// two presets, DeckLow takes the more expensive value in all 13. The Deck presets are tuned to
// a Steam Deck's budget, which sits above desktop Low. So this sweep asks: which of those 13
// steps is actually buying the frame time?
//
// "One step down" means one step in Selaco's OWN menu, read from MENUDEF.zsc rather than
// guessed - DecalMax (956), LowTillUltra (1007), MirrorRecursions (947), GameDetail (1276),
// ParticleIntensity (1288), BloodQuality (1470), lightingqualitysetting (1479),
// smokequality (1503). gl_ssao and gl_shadowmap_quality use GZDoom's own scales
// (0/1/2 and 128/256/512/1024).

alias bench_ssao1     "echo BENCHMARK_SET=ssao_1;            gl_ssao 1"
alias bench_ssao0     "echo BENCHMARK_SET=ssao_0;            gl_ssao 0"
alias bench_noshadow  "echo BENCHMARK_SET=light_shadowmap_0; gl_light_shadowmap 0"
alias bench_shadow256 "echo BENCHMARK_SET=shadowmap_256;     gl_shadowmap_quality 256"
alias bench_nobloom   "echo BENCHMARK_SET=bloom_0;           gl_bloom 0"
alias bench_nofog     "echo BENCHMARK_SET=fogeffects_0;      r_fogeffects 0"
alias bench_light1    "echo BENCHMARK_SET=lightingquality_1; lightingquality 1"
alias bench_detail2   "echo BENCHMARK_SET=gamedetail_2;      g_gamedetail 2"
alias bench_mirror1   "echo BENCHMARK_SET=mirror_1;          r_mirror_recursions 1"
alias bench_decals250 "echo BENCHMARK_SET=maxdecals_250;     cl_maxdecals 250"
alias bench_smoke1    "echo BENCHMARK_SET=smokequality_1;    r_smokequality 1"
alias bench_particle1 "echo BENCHMARK_SET=particles_1;       r_particleIntensity 1"
alias bench_rain0     "echo BENCHMARK_SET=rainquality_0;     r_rainquality 0"
alias bench_blood0    "echo BENCHMARK_SET=bloodquality_0;    r_BloodQuality 0"

bind F2  bench_ssao1
bind F3  bench_ssao0
bind F4  bench_noshadow
bind F5  bench_shadow256
bind F6  bench_nobloom
bind F7  bench_nofog
bind F8  bench_light1
bind F9  bench_detail2
bind F10 bench_mirror1
bind F11 bench_decals250
bind F12 bench_smoke1
bind Home bench_particle1
bind End  bench_rain0
bind Ins  bench_blood0

// Android keycodes: F1=131 F2=132 F3=133 F4=134 F5=135 F6=136 F7=137 F8=138 F9=139 F10=140
// F11=141 F12=142 Home=122 End=123 Ins=124
//
// Every key above is bound exactly ONCE. Keep it that way: this file previously bound Ins,
// End, PgUp, PgDn and Home twice each, and since the last binding silently wins, an entire
// eight-window sweep measured one configuration while appearing to measure eight.
//
// Removed as concluded, so nothing here is a dead key:
//   - vk_submit_size sweep (50 to 4000): the 1000 default is the minimum of a U-shaped curve.
//   - vid_scalefactor 0.5/0.75: ~18% at 0.75, judged not worth the softness on a 7-inch panel.
//   - r_skiplists / r_maxlights_flat / r_playerlights_flat ablations: superseded by the
//     per-draw-list GPU timers, and ablation gives a marginal total rather than a breakdown.
//   - vk_defer_frame_wait and vk_frames_in_flight: frames in flight is now a compile-time
//     constant 2 (see VkCommandBufferManager::framesInFlight); toggling it at runtime was
//     itself a use-after-free.

// --- Controller toggle for SSAO, for judging it in actual play --------------------
//
// Only 0 and 2 are worth toggling between. Any non-zero gl_ssao puts the WHOLE scene into a
// 3-draw-buffer G-buffer pass (hw_entrypoint.cpp:146-149), so level 1 pays nearly the full cost:
// measured 2->1 saves 0.3 ms while 2->0 saves 3.3 ms. It is effectively a binary setting.
//
// A self-redefining alias pair gives a real toggle on one button - each state rebinds
// ssao_toggle to the other, the classic Quake console idiom.
alias ssao_off "gl_ssao 0; echo SSAO_OFF; alias ssao_toggle ssao_on"
alias ssao_on  "gl_ssao 2; echo SSAO_ON;  alias ssao_toggle ssao_off"
alias ssao_toggle ssao_off

// EVERY gamepad button on this device is already bound by Selaco: RThumb (R3) is meleeButton,
// LThumb crouch, LShoulder +DashMode, RShoulder weaponWheel, the four face buttons and Start/Back
// all in use. DPadLeft was printObjectives - an info readout, the cheapest thing to give up while
// benchmarking. R3 was deliberately NOT used: losing melee during combat is exactly the wrong
// trade when combat is when you want to be judging performance.
//
// NOTE this persists: GZDoom serialises bindings into the ini, so it survives switching back to
// another config. Undo it with the console command  bind DPadLeft printObjectives
// or by pressing the restore key below.
bind DPadLeft ssao_toggle

alias restore_objectives "bind DPadLeft printObjectives; echo DPADLEFT_RESTORED"
bind Pad_Back restore_objectives

// Buffer allocation inventory, for attributing memory instead of guessing at dumpsys meminfo.
// F9 is free (the DeckLow sweep uses F1-F8, Home, End, Ins).
alias bench_bufmem "echo BENCHMARK_SET=bufmem; vkbufmem"
bind F9 bench_bufmem
