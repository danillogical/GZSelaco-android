// AYN Odin (first generation)
//
// The weakest device in this set, and the only one that does not take a Deck preset.

name AYN Odin

// DELIBERATELY `Low` AND NOT `DeckLow`. DO NOT "FIX" THIS.
//
// The names suggest DeckLow is the lighter of the two. It is not. The two blocks in Selaco's
// MENUDEF.zsc carry the same 32 cvars and differ in exactly 13, and DeckLow takes the MORE
// EXPENSIVE value in all 13 of them:
//
//   gl_light_shadowmap   0 -> 1      cl_maxdecals        250 -> 500
//   gl_shadowmap_quality 128 -> 512  r_smokequality        1 -> 2
//   gl_ssao              0 -> 2      r_rainquality         0 -> 1
//   r_particleIntensity  1 -> 2      r_BloodQuality        0 -> 1
//   lightingquality      1 -> 2      r_fogeffects          0 -> 1
//   gl_bloom             0 -> 1      g_gamedetail          2 -> 3
//   r_mirror_recursions  1 -> 2
//
// DeckLow is tuned for a Steam Deck, which is a much stronger machine than a first-generation
// Odin; `Low` is genuinely the lighter preset and is what this device wants. This is not
// inconsistent with steam_deck_performance.cfg using DeckLow - that profile is for the hardware
// DeckLow was actually tuned for.
gfx_preset Low

// Selaco's handheld UI block still applies: it is about menu and HUD scale, not rendering cost.
steamdeck 1

second_screen 0

// visibility is deliberately not set, and on this device it would make no difference either way:
// VisibilityPresetSpectacleDeck sets r_smokedensity 1 and r_particleLifespan 1, which is already
// exactly what GFXPresetLow sets them to. Omitted rather than written as a no-op so the profile
// does not imply a choice it is not making; an unset key leaves those cvars alone.

screen_size 1.75

// 30 for the same reason as the rest of the AYN line: a 60 Hz panel, and no prospect of 60 fps.
max_fps 30
