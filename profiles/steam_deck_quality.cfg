// Steam Deck - Quality
//
// The other of the two choices Selaco's own first-run quality dialog offers a Steam Deck, and the
// one it DEFAULTS to: the dialog selects index 6 of GFXPresetsQualityMenuLinux (MENUDEF.zsc:622) for
// a detected Deck (quality_menu.zs:151-153, and again at :462 if the player just presses Continue).
// Index 6 is GFXPresetDeckHigh, and Selaco's own description for that entry is "Quality setting for
// Steam Deck" (GFXPresetDescLinux).
//
// This is therefore the profile a Steam Deck owner gets today if they accept the defaults, and it
// applies the same graphics preset as ayn_thor.cfg - the Thor reaches the same dialog branch.

name Steam Deck - Quality

gfx_preset DeckHigh

// Same reasoning as in steam_deck_performance.cfg: visibility is asked separately and lands on the
// handheld option regardless of the quality choice.
visibility SpectacleDeck

steamdeck 1
second_screen 0

screen_size 1.75

// 60 to match the Deck's 60 Hz LCD - see the longer note in steam_deck_performance.cfg. An OLED
// Deck is 90 Hz and may want `max_fps 90`.
max_fps 60
