// AYN Thor
//
// This profile reproduces what the game already does on the Thor, so that switching to the
// picker in step 2 is not a change in behaviour. Every value below was derived from Selaco's
// own first-run flow rather than from an ini snapshot or a measurement - see profiles/README.md
// for the chain, and do not "simplify" it without re-reading that.
//
// The short version: the engine forces g_steamdeck on for Android (src/d_main.cpp:3528), which
// makes UIHelper.TestForSteamDeck() return true on its first line, which makes the first-run
// quality dialog pick its Steam-Deck-Quality option rather than its desktop default.

name AYN Thor

// GFXPresetDeckHigh. The first-run quality dialog selects index 6 of its option list
// (quality_menu.zs:151-153, and again at :462 if the player just presses Continue). On a Unix
// build - which Android is - that list is GFXPresetsQualityMenuLinux, whose index 6 is
// GFXPresetDeckHigh. NOT High, which is what index 2 would give on a non-handheld.
gfx_preset DeckHigh

// VisibilityPresetSpectacleDeck. The visibility dialog uses the same clamp(6, ...) idiom
// (visibility_menu.zs:134-136), but its list - VisibilityPresetDeck - has only three entries, so
// the clamp lands on index 2, which is SpectacleDeck.
visibility SpectacleDeck

// Selaco's own UI/HUD block for handhelds: larger menus and subtitles, aim assist on.
// Called by reflection, never reimplemented, so it tracks whatever the shipped game means by it.
steamdeck 1

// The Thor is the one device here with a second screen, so it is the one profile that turns the
// panel on. Stated explicitly rather than relied on: an unset key leaves aux_panel exactly as the
// game had it, which is not the same as asking for it to be on.
second_screen 1
screen_size 1.75

// The Thor's panel is 60 Hz and the game does not hold 60 fps on it; 30 is a stable half-rate
// rather than a preference. This matches the shipped android/configs/thor.cfg.
max_fps 30
