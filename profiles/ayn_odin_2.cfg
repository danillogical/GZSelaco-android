// AYN Odin 2
//
// Identical to ayn_thor.cfg except that the Odin 2 has no second screen. Same SoC class and the
// same 1080p panel, so the graphics choices Selaco's own first-run flow makes for the Thor apply
// unchanged - see the derivation comments in ayn_thor.cfg.

name AYN Odin 2

gfx_preset DeckHigh
visibility SpectacleDeck
steamdeck 1

// The only difference from the Thor. With no panel to draw, the second-screen work is pure cost:
// turning it off has measured around 2.7 ms of frame time in this project.
second_screen 0

// Stated even though the panel is off, so that the value is asserted rather than inherited from
// whatever a previously applied profile left behind.
screen_size 1.75

max_fps 30
