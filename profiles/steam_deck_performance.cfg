// Steam Deck - Performance
//
// One of the two choices Selaco's own first-run quality dialog offers a Steam Deck, preserved here
// so that replacing that dialog with the picker in step 2 does not take the choice away.
//
// GFXPresetDeckLow is index 5 of GFXPresetsQualityMenuLinux (MENUDEF.zsc:622), the list the dialog
// uses on a Unix build. Selaco's own description for that entry is "Performance setting for Steam
// Deck" (GFXPresetDescLinux), which is where the name of this profile comes from - it is their
// label, not an interpretation of ours.
//
// Using DeckLow here is deliberate and is NOT inconsistent with ayn_odin.cfg deliberately using
// `Low` instead: DeckLow is heavier than Low, and this is the hardware Selaco actually tuned
// DeckLow for.

name Steam Deck - Performance

gfx_preset DeckLow

// The visibility dialog is a separate question from the quality one, and it makes the same handheld
// choice whichever quality option was picked (visibility_menu.zs:134-136 clamps to the last entry of
// VisibilityPresetDeck, which is SpectacleDeck). So both Steam Deck profiles carry it.
visibility SpectacleDeck

steamdeck 1
second_screen 0

// Stated so the profile asserts a size rather than inheriting whatever was applied last, even
// though the second screen is off here.
screen_size 1.75

// 60, not 30 and not uncapped. The Deck's LCD panel is 60 Hz, so 60 is what it can actually show;
// 30 was only ever right for the AYN Thor's panel, and leaving it uncapped (Selaco's own default is
// 200) burns battery rendering frames the panel never presents. An OLED Deck is 90 Hz and may want
// `max_fps 90`.
//
// Nothing in Selaco's first-run flow sets a frame cap at all, so there was no value to copy from
// it - this is a judgement about the hardware rather than something derived from the dialog.
max_fps 60
